  const d=diff(), r=rnd(), z=row.z;
  if(phase===2&&phaseT>10&&r<0.18){ addBat(pick(avail),z); return; }
  if(r<0.46){ shuffle(avail).slice(0,d>0.45&&rnd()<0.4?2:1).forEach(l=>addRock(l,z)); return; }

  const n=(avail.length===3&&rnd()<0.3+d*0.3)?2:1;

    dino.bodyMat.emissive.copy(lc(STAGE[stage].em,0xffffff,e)); dino.bodyMat.emissiveIntensity=1+e*1.5;
    if(t>=1.3){ evo.swapped=true; flash(1,'#fff'); sfx('boom',0.6); shake=0.9;
      explodeDino(true); dino.inner.rotation.y=0; dino.bodyMat.emissiveIntensity=1; const old=stage;
      setForm(evo.to); dinoColors(1); placeDino();
      for(const mm of dino.meshes){ mm.start=mm.list.map(p=>{ _v.set(rnd()-.5,rnd()-.5,rnd()-.5).normalize().multiplyScalar(2+rnd()*3); return [p[0]+_v.x,p[1]+_v.y+1,p[2]+_v.z]; }); mm.rot=mm.list.map(()=>[rnd()*6,rnd()*6,rnd()*6]); }
      dino.legs.forEach(l=>l.scale.setScalar(0.01)); dino.wings.forEach(w=>w.scale.setScalar(0.01));
      $('evoTxt').textContent=STAGE[old].name+' ▸ '+STAGE[evo.to].name+'!'; }
  } else {
    const k=1-Math.pow(1-clamp((t-1.3)/1.4,0,1),3);
    for(const mm of dino.meshes){ const n=mm.list.length; for(let i=0;i<n;i++){ const a=mm.start[i], b=mm.list[i], ro=mm.rot[i];
      _v.set(lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)); qe.set(ro[0]*(1-k),ro[1]*(1-k),ro[2]*(1-k)); qq.setFromEuler(qe); qs.setScalar(1); qm.compose(_v,qq,qs); mm.im.setMatrixAt(i,qm); }
      mm.im.instanceMatrix.needsUpdate=true; }
    dino.legs.forEach(l=>l.scale.setScalar(Math.max(0.01,k))); dino.wings.forEach(w=>{ w.scale.setScalar(Math.max(0.01,k)); w.rotation.z=w.userData.side*(0.4+0.5*Math.sin(t*14)); });
    dino.inner.rotation.y=(1-k)*TAU*2;
    dino.bodyMat.emissive.copy(lc(0xffffff,STAGE[stage].em,k)); dino.bodyMat.emissiveIntensity=lerp(2.5,1,k);
    if(t>2.75&&!evo.roared){ evo.roared=true; sfx('roar'); shake=1; $('evo').classList.remove('on');
      for(let q=0;q<70;q++){ const a=q/70*TAU; emitLocal(0,0.4,0,Math.cos(a)*16,0.5,Math.sin(a)*16,0.8,1.0,hsl(q/70),1.5); }
      banner('DINO EVOLVED!',STAGE[stage].name,'#'+new THREE.Color(STAGE[stage].body).getHexString()); hint(STAGE[stage].ability); musicDuck(0.5); }
    dino.inner.rotation.x=t>2.75?0.3*Math.sin(PI*clamp((t-2.75)/1.0,0,1)):0;
    if(t>=3.95){ dino.inner.rotation.set(0,0,0); pillar.visible=false; mode='play'; ts=tsTarget=1;
      for(let j=obs.length-1;j>=0;j--) if(obs[j].z>-45) removeOb(j);
      if(phase===4) for(const sg of T4.segs.slice(T4.si,T4.si+2)) for(const o of sg.obs) if(o.alive&&(sg!==curSeg()||o.s<pl.s+45)&&sg===curSeg()){ o.alive=false; o.meshes.forEach(m=>m.parent&&m.parent.remove(m)); }
      if(stage===4) energy=100; camA=pl.a; }
  }
}
function fireBreath(){
  if(phase!==4||stage<4||mode!=='play'||breathT>0) return;
  if(energy<40){ pop('NOT ENOUGH FIRE'); return; }
  energy-=40; breathT=1.0; sfx('beam'); shake=Math.max(shake,0.35);
}
function updateBreath(dt){
  if(phase===4&&stage===4&&mode==='play') energy=Math.min(100,energy+dt*16);
  if(breathT<=0||mode!=='play'){ if(mode==='play'||mode==='dead') beamG.visible=false; return; }
  breathT-=dt; mouthWorld(_bf); _bt.set(pl.x,0.9,-75); placeBeam(_bf,_bt,0.85+0.15*Math.sin(totalT*50));
  for(let j=obs.length-1;j>=0;j--){ const o=obs[j]; if(Math.abs(o.x-pl.x)<1.7&&o.z<1.5&&o.z>-75&&o.kind!=='fire'||(o.kind==='fire'&&o.deadly&&Math.abs(o.x-pl.x)<1.7&&o.z<1.5)) smashOb(o,100,true); }
  for(let j=frags.length-1;j>=0;j--){ const f=frags[j]; if(f.lane===playerLaneIdx()&&f.t>0.1){ const mp=f.mesh.position;
    burst(mp.x,mp.y,mp.z,80,20,1.8,1,FIRE,0,-6); sfx('boom',0.45); score+=250; pop('SHOT DOWN! +250');
    laneG.remove(f.mesh); laneG.remove(f.marker); f.own.forEach(m=>m.dispose()); frags.splice(j,1); } }
  for(let q=0;q<4;q++){ const k=rnd(); emit(lerp(_bf.x,_bt.x,k),lerp(_bf.y,_bt.y,k),lerp(_bf.z,_bt.z,k),(rnd()-.5)*6,rnd()*6,(rnd()-.5)*6,0.5,1.0,3,1.2,0.2,0,1,0); }
  if(breathT<=0) beamG.visible=false;
}
function update3D(rdt){
  totalT+=rdt;
  if(mode==='evolve'){ updateEvolve(rdt); updateParticles(rdt,0); updateDebris(rdt); lightFollow(); return; }
  ts=lerp(ts,tsTarget,1-Math.exp(-rdt*(mode==='qte'?6:2.5)));
  const dt=rdt*ts;
  if(mode==='reveal') updateReveal(rdt);
  if(mode==='play') phaseT+=dt;
  if(mode==='play'){ const base=(phase===2?18+phaseT*0.22:phase===3?(29+phaseT*0.3)*(1+0.5*hyperK):21+phaseT*0.25)*speedMul; v=lerp(v,base,1-Math.exp(-dt*2)); }
  else if(mode==='dead'){ v*=Math.exp(-dt*2); }
  else if(mode==='finale'||mode==='won'){ v=lerp(v,phase===4?0:6,1-Math.exp(-dt*2)); }
  if(mode==='dead'){ deadT+=rdt; if(deadT>1.4&&!panelOpen) showPanel('dead'); }
  if(mode==='qte'){ charge=Math.max(0,charge-rdt*0.06); $('qbar').style.width=(charge*100).toFixed(1)+'%'; dino.bodyMat.emissiveIntensity=1+charge*2; }
  // evolution triggers
  if(mode==='play'&&pl.ground){
    if(phase===2&&stage===1&&phaseT>4&&phaseT<DUR[2]-7&&(score>=800||phaseT>=26)){ startEvolve(2); return; }
    if(phase===3&&stage===2&&phaseT>4&&phaseT<13){ startEvolve(3); return; }
    if(phase===4&&stage<4&&phaseT>1.2){ startEvolve(4); return; }
  }
  // world
  if(phase===3) tubeUpdate(dt); else if(phase===4){ iceUpdate(dt); updateBreath4(dt); } else { laneUpdate(dt); updateBreath(dt); }
  // player
  const ducking=(downHeld||duckT>0)&&pl.ground&&phase!==3; duckT-=dt;
  if(mode==='play'||mode==='qte'||mode==='reveal'){
    if(phase===3){ pl.a+=(pl.aT-pl.a)*(1-Math.exp(-dt*13));
      if(!pl.ground){ pl.vy-=G*dt*(downHeld?1.8:1); pl.y+=pl.vy*dt; if(pl.y<=0){ pl.y=0; pl.vy=0; pl.ground=true; pl.jumps=0; sfx('land'); } } }
    else if(phase===4) iceMove(dt);
    else { pl.x+=(pl.lane*LANE_W-pl.x)*(1-Math.exp(-dt*14));
      const tile=tileUnder();
      if(pl.ground&&!tile){ pl.ground=false; pl.vy=0; }
      if(!pl.ground){ const py=pl.y; pl.vy-=G*dt*(downHeld?1.8:1); pl.y+=pl.vy*dt;
        if(tile&&pl.y<=0&&py>=-0.05&&pl.vy<=0){ pl.y=0; pl.vy=0; pl.ground=true; pl.jumps=0; sfx('land'); const p=dino.group.position; burst(p.x,0.1,0,14,4,0.5,0.4,phase===4?ROCKC:FIRE,1,-4); if(stage>=2) shake=Math.max(shake,0.15*stage); }
        if(pl.y<-3.2) die('lava'); } }
    if(mode==='play'){ if(phase===3) tubeCollide(); else if(phase===4) iceCollide(ducking); else laneCollide(ducking); score+=v*dt*1.0; }
  }
  if(mode==='finale'||mode==='won'){ if(phase===4) updateFinale4(dt); else updateFinale(dt); }
  if(mode==='dead'&&phase===4&&deathCause==='fall'){ pl.vy-=G*dt; pl.y+=pl.vy*dt; }
  // dino transform + anim
  const d=dino, sc=d.scale;
  placeDino();
  if(v>0.5&&pl.ground) d.run+=dt*v*0.55/sc;
  const air=!pl.ground;
  d.legL.rotation.x=air?0.6:Math.sin(d.run)*0.9*Math.min(1,v/8); d.legR.rotation.x=air?0.4:-Math.sin(d.run)*0.9*Math.min(1,v/8);
  for(const w of d.wings) w.rotation.z=w.userData.side*(air?0.2+0.7*Math.sin(totalT*16):0.45+0.25*Math.sin(totalT*5));
  d.inner.position.y=pl.ground?Math.abs(Math.sin(d.run))*0.06:0;
  d.inner.scale.y=lerp(d.inner.scale.y,ducking?0.55:1,1-Math.exp(-dt*18));
  if(mode!=='finale'&&mode!=='won') d.inner.rotation.x=lerp(d.inner.rotation.x,ducking?-0.25:(air?clamp(pl.vy*0.02,-0.35,0.35):0),1-Math.exp(-dt*10));
  d.inner.rotation.z=phase===3?0:(pl.x-pl.lane*LANE_W)*0.12;
  if(phase===4) d.inner.rotation.y=lerp(d.inner.rotation.y,0,0.2);
  if(phase===3&&mode==='play'&&rnd()<dt*30){ const p=d.group.position; emit(p.x,p.y,p.z+1,0,0,0,0.5,0.35,...pick(NEON),0,0,1); }
  if(stage===4&&mode==='play'&&rnd()<dt*25){ const p=d.group.position; emit(p.x+(rnd()-.5)*0.6,p.y+1.5+rnd(),p.z+1.4,(rnd()-.5),1+rnd()*2,2,0.6,0.5,3,1.1,0.2,0,1,1); }
  updateDebris(dt);
  updateParticles(dt,phase===4?0:v);
  lightFollow();
  // camera
  if(mode!=='reveal'){
    if(phase===3){ camA+=(pl.a-camA)*(1-Math.exp(-rdt*8)); const s=Math.sin(camA), c=Math.cos(camA), cr=TR-4.3-(sc-1)*1.2;
      camBase.set(s*cr,-c*cr,7.5+(sc-1)*2); camera.up.set(-s,c,0); look.set(s*(TR-1.6),-c*(TR-1.6),-16); }
    else if(phase===4&&(mode==='finale'||mode==='won')){ camera.up.set(0,1,0); const P=dino.group.position, fx=-Math.sin(T4.camYaw), fz=-Math.cos(T4.camYaw);
      if(!finale.hit){ camBase.lerp(_gp.set(P.x-fx*13+(-fz)*7,3.2*sc,P.z-fz*13+fx*7),1-Math.exp(-rdt*3)); look.lerp(_v.set((P.x+T4.titanChest.x)/2,(2+T4.titanChest.y)/2,(P.z+T4.titanChest.z)/2),1-Math.exp(-rdt*4)); }
      else { camBase.lerp(_gp.set(P.x-fx*14,4.5+(sc-1)*2,P.z-fz*14),1-Math.exp(-rdt*2)); look.lerp(_v.set(P.x+fx*6,1.5,P.z+fz*6),1-Math.exp(-rdt*2)); } }
    else if(phase===4){ gameCam(sc,camBase,look,_gu); camera.up.copy(_gu); if(mode==='qte'){ look.y=lerp(look.y,12,0.5); } }
    else if(mode==='finale'||mode==='won'){ camera.up.set(0,1,0);
      if(!finale.hit){ camBase.lerp(_gp.set(pl.x+7,2.4*sc,15),1-Math.exp(-rdt*3)); look.lerp(_v.set(0,meteor.g.position.y*0.45,meteor.g.position.z*0.45),1-Math.exp(-rdt*4)); }
      else { camBase.lerp(_gp.set(pl.x*0.5,4+(sc-1)*2,14),1-Math.exp(-rdt*2)); look.lerp(_v.set(0,1.5,-6),1-Math.exp(-rdt*2)); } }
    else { camera.up.set(0,1,0); const k=1-Math.exp(-rdt*6);
      camBase.x=lerp(camBase.x,pl.x*0.55,k); camBase.y=lerp(camBase.y,4.6+(sc-1)*2+Math.max(-3,pl.y)*0.35,1-Math.exp(-rdt*5)); camBase.z=lerp(camBase.z,9.5+(sc-1)*3,k);
      look.set(pl.x*0.75,1.6+(sc-1)+pl.y*0.25,-14); if(mode==='qte'){ look.y=lerp(look.y,16,0.65); } }
    camera.position.copy(camBase); camera.lookAt(look);
  } else camBase.copy(camera.position);
  shake=Math.max(0,shake-rdt*2.2);
  if(shake>0){ const s=shake*shake*0.35; camera.position.x+=(rnd()-.5)*s; camera.position.y+=(rnd()-.5)*s; }
  const fov=60+clamp((v-20)*0.4,0,12)+hyperK*22+(mode==='qte'?-6:0); if(Math.abs(camera.fov-fov)>0.05){ camera.fov=lerp(camera.fov,fov,1-Math.exp(-rdt*3)); camera.updateProjectionMatrix(); }
  if(sky4.visible) sky.position.copy(camera.position);
}

// ================= UI =================
function banner(k,t,c){ const b=$('banner'); b.style.setProperty('--c',c||'#ff5a1f'); b.innerHTML=`<div class="k">${k}</div><div class="t">${t}</div>`; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
let hintT=0; function hint(t){ $('hint').textContent=t; $('hint').classList.add('on'); hintT=5; }
let flashCol='#fff'; function flash(a,c){ flashA=a; $('flash').style.background=c||'#fff'; }
const pad=n=>String(Math.floor(n)).padStart(5,'0');
const LINES={lava:'You fell in the lava. A classic.',rock:'Turns out rocks are hard.',pillar:'You ran into a pillar of fire. Bold.',bat:'Bitten by a lava bat. Rough.',geyser:'Launched by a lava geyser.',fire:'The Titan\'s fireball got you.',tube:'Splattered across the hypertube.',meteor:'Hit by the apocalypse. Personally.',fall:'You missed the turn. Into the abyss.',wall:'Face-planted into an ice wall.',arch:'Forgot to duck.',spike:'Impaled by an icicle. Cold.',snowman:'Defeated by a snowman.',penguin:'Taken out by a penguin. Embarrassing.'};
function showPanel(type){
  panelOpen=true; $('panel').classList.add('on'); $('phase').classList.remove('on'); $('hint').classList.remove('on');
  const st=$('pstats');
  if(type==='dead'){
    $('pk').textContent='PHASE '+phase+' · '+NAMES[phase]; $('pt').textContent='EXTINCT.'; $('ps').textContent=LINES[deathCause]||'Gone.';
    st.innerHTML=`<div>SCORE<b>${pad(score)}</b></div><div>BEST<b>${pad(hi)}</b></div>`;
    $('b1').textContent='RETRY PHASE '+phase; $('b2').textContent='FROM THE 404';
    $('b1').onclick=()=>{ hidePanel(); startPhase(phase); };
    $('b2').onclick=()=>{ hidePanel(); resetAll(); };
  } else {
    $('pk').textContent='YOU WIN'; $('pt').textContent='ICE AGE: CANCELLED'; $('ps').textContent='You melted the Ice Titan with your face. The dinosaurs live forever. Humans? Never heard of them.';
    st.innerHTML=`<div>SCORE<b>${pad(score)}</b></div><div>BEST<b>${pad(hi)}</b></div><div>LOOP<b>×${(speedMul).toFixed(2)}</b></div>`;
    $('b1').textContent='AGAIN, BUT FASTER'; $('b2').textContent='BACK TO THE 404';
    $('b1').onclick=()=>{ hidePanel(); speedMul*=1.2; startPhase(2); };
    $('b2').onclick=()=>{ hidePanel(); resetAll(); };
  }
}
function hidePanel(){ panelOpen=false; $('panel').classList.remove('on'); }
function resetAll(){
  setTrack(null); speedMul=1; score=0; stage=1; setupPhase(2); phase=1; mode='p1wait'; resetP1();
  cv2.style.display='block'; cv3.style.opacity=0; $('p1top').style.opacity=1; document.body.classList.remove('d3'); $('phase').classList.remove('on'); $('qte').style.display='none';
}
function hudTick(rdt){
  $('sc').textContent=pad(score); $('hi').textContent='HI '+pad(Math.max(hi,score));
  if(phase>=2){ $('phName').textContent='PHASE '+phase+' · '+NAMES[phase]; $('phBar').style.width=(clamp(phaseT/DUR[phase],0,1)*100).toFixed(1)+'%'; }
  hintT-=rdt; if(hintT<=0) $('hint').classList.remove('on');
  const br=phase===4&&stage===4&&(mode==='play'||mode==='dead');
  $('breath').style.display=br?'block':'none'; $('fireBtn').style.display=br&&TOUCH&&mode==='play'?'block':'none';
  if(br) $('brBar').style.width=energy.toFixed(0)+'%';
  if(flashA>0){ flashA=Math.max(0,flashA-rdt*1.4); $('flash').style.opacity=flashA; }
}

// ================= INPUT =================
function act(a){
  auInit();
  if(panelOpen) return;
  if(mode==='p1wait'){ if(a==='jump'){ mode='p1'; jump2D(); } return; }
  if(mode==='p1'){ if(a==='jump') jump2D(); if((a==='down'||a==='duckTap')&&!p1.ground) p1.vy=Math.min(p1.vy,-PX*400); return; }
  if(mode==='qte'){ if(a==='jump'||a==='fire') chargeUp(); return; }
  if(mode!=='play') return;
  if(a==='fire') fireBreath();
  else if(a==='jump') jump3D();
  else if(a==='left'||a==='right'){ const d=a==='left'?-1:1;
    if(phase===3){ pl.aT+=d*TAU/8; sfx('lane'); }
    else { const sg=phase===4?curSeg():null;
      if(sg&&sg.turn===d&&pl.s>sg.L-18&&pl.s<=sg.L+HW){ if(pl.s>=sg.L-2.5) doTurn(); else { T4.pend=d; sfx('lane'); } }
      else { const nl=clamp(pl.lane+d,-1,1); if(nl!==pl.lane){ pl.lane=nl; sfx('lane'); } } } }
  else if(a==='duckTap'){ duckT=0.7; if(!pl.ground) pl.vy=Math.min(pl.vy,-18); }
  else if(a==='down'){ if(!pl.ground) pl.vy=Math.min(pl.vy,-18); }
}
addEventListener('keydown',e=>{
  const k=e.code;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) e.preventDefault();
  if(k==='KeyM'){ auInit(); toggleMute(); return; }
  if(panelOpen){ if(!e.repeat&&(k==='Space'||k==='Enter')) $('b1').click(); return; }
  if(e.repeat&&k!=='ArrowDown'&&k!=='KeyS') return;
  if(k==='Space'||k==='ArrowUp'||k==='KeyW') act('jump');
  else if(k==='ArrowLeft'||k==='KeyA') act('left');
  else if(k==='ArrowRight'||k==='KeyD') act('right');
  else if(k==='ArrowDown'||k==='KeyS'){ downHeld=true; act('down'); }
  else if(k==='KeyF'||k==='KeyX') act('fire');
});
addEventListener('keyup',e=>{ if(e.code==='ArrowDown'||e.code==='KeyS') downHeld=false; });
let tStart=null;
$('fireBtn').addEventListener('pointerdown',e=>{ e.preventDefault(); act('fire'); });
addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest('button')) return; tStart={x:e.clientX,y:e.clientY,done:false}; auInit(); });
addEventListener('pointermove',e=>{ if(!tStart||tStart.done) return; const dx=e.clientX-tStart.x, dy=e.clientY-tStart.y;
  if(Math.hypot(dx,dy)>34){ tStart.done=true; if(Math.abs(dx)>Math.abs(dy)) act(dx>0?'right':'left'); else if(dy>0) act('duckTap'); else act('jump'); } });
addEventListener('pointerup',()=>{ if(tStart&&!tStart.done) act('jump'); tStart=null; });
addEventListener('pointercancel',()=>{ tStart=null; });
let paused=false;
document.addEventListener('visibilitychange',()=>{ paused=document.hidden; last=performance.now(); });

// ================= MAIN =================
function resize(){ W=innerWidth; H=innerHeight; size2D(); renderer.setSize(W,H,false); composer.setSize(W,H); camera.aspect=W/H; camera.updateProjectionMatrix(); pMat.uniforms.uScale.value=H*0.6; if(mode==='p1wait') resetP1(); }
addEventListener('resize',resize);
size2D(); resetP1(); setupPhase(2); phase=1;
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const rdt=Math.min(0.05,(now-last)/1000); last=now; if(paused) return;
  try{
    if(mode==='p1wait'||mode==='p1'||mode==='twist'){ update2D(rdt); render2D(); }
    else { update3D(rdt); composer.render(rdt); }
    auTick(); hudTick(rdt);
  }catch(err){ const e=$('err'); e.style.display='block'; e.textContent='error: '+err.message; console.error(err); }
}
// warm up shaders once so the twist has no hitch
composer.render(); requestAnimationFrame(loop);
window.__game={get p1(){return p1},ice:()=>{const c=curSeg();return c?{turn:c.turn,L:c.L,s:pl.s,si:T4.si,pend:T4.pend,y:pl.y,fin:c===T4.finalSeg}:null},get stage(){return stage},set stage(x){setForm(x);dinoColors(1)},set god(x){GOD=x},twist:()=>twistStart('time'),get mode(){return mode},get phase(){return phase},get phaseT(){return phaseT},set phaseT(x){phaseT=x},startReveal,startPhase,act,get score(){return score}};
</script>
